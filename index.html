<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hand Game Online - Center Aligned</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; touch-action: none; }
        #container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        video { transform: scaleX(-1); display: none; }
        canvas { position: absolute; top: 0; left: 0; transform: scaleX(-1); }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        .overlay-text { position: absolute; color: #0f0; font-size: 28px; text-shadow: 2px 2px 4px #000; font-weight: bold; }
        
        #score-board { top: 15px; left: 15px; }
        #timer-board { top: 15px; right: 15px; color: #fff; }
        #msg-center { top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 32px; text-align: center; color: #0f0; width: 90%; }
        
        @media (max-width: 600px) {
            .overlay-text { font-size: 22px; }
            #msg-center { font-size: 24px; }
        }
    </style>
</head>
<body>

<div id="container">
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>
    <div id="ui-layer">
        <div id="score-board" class="overlay-text">Score: 0</div>
        <div id="timer-board" class="overlay-text">Time: 60</div>
        <div id="msg-center" class="overlay-text">
            カメラ起動中...<br>
            <span style="font-size: 18px; color: #ccc;">(カメラの使用を許可してください)</span>
        </div>
    </div>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const scoreElement = document.getElementById('score-board');
    const timerElement = document.getElementById('timer-board');
    const msgElement = document.getElementById('msg-center');

    let score = 0;
    let count = 1;
    let gameStarted = false;
    let isCoolingDown = false; 
    let remainingTime = 60;
    let startTime = 0;
    let cameraActive = false;

    // サイズ設定
    const circleRadius = 44; // 基準の0.8倍
    const fingerRadius = 30; 
    const fontSize = 60;     

    let circles = [];
    let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    let vScale, vOffsetX, vOffsetY;

    function speak(text) {
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        window.speechSynthesis.speak(uttr);
    }

    function playBeep() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 900;
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function resizeCanvas() {
        canvasElement.width = window.innerWidth;
        canvasElement.height = window.innerHeight;
        if (!gameStarted) initCircles();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function initCircles() {
        circles = [];
        let nums = Array.from({length: 10}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
        let sides = Array.from({length: 10}, () => Math.random() < 0.5 ? 'Left' : 'Right');

        for (let i = 0; i < 10; i++) {
            const sectionWidth = canvasElement.width / 10;
            let x, y;
            let attempts = 0;

            while (attempts < 100) {
                x = (i * sectionWidth) + (Math.random() * (sectionWidth - circleRadius * 2.5)) + circleRadius * 1.25;
                y = Math.random() * (canvasElement.height - 200) + 100;
                
                // UI回避エリア
                const avoidWidth = 180; 
                const avoidHeight = 80;
                const isScoreArea = (x > canvasElement.width - avoidWidth && y < avoidHeight);
                const isTimerArea = (x < avoidWidth && y < avoidHeight);
                
                const isOverlapping = circles.some(c => {
                    const d = Math.sqrt((x - c.x)**2 + (y - c.y)**2);
                    return d < circleRadius * 2.1;
                });

                if (!isScoreArea && !isTimerArea && !isOverlapping) break;
                attempts++;
            }
            circles.push({ x: x, y: y, num: nums[i], handType: sides[i], cleared: false });
        }
    }

    function onResults(results) {
        if (!cameraActive) {
            cameraActive = true;
            msgElement.innerHTML = "手を挙げてスタート";
        }

        const vW = videoElement.videoWidth;
        const vH = videoElement.videoHeight;
        const cW = canvasElement.width;
        const cH = canvasElement.height;
        
        vScale = Math.max(cW / vW, cH / vH);
        vOffsetX = (cW - vW * vScale) / 2;
        vOffsetY = (cH - vH * vScale) / 2;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, cW, cH);
        canvasCtx.drawImage(results.image, vOffsetX, vOffsetY, vW * vScale, vH * vScale);

        if (results.multiHandLandmarks && results.multiHandedness) {
            for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                const landmarks = results.multiHandLandmarks[i];
                const handLabel = results.multiHandedness[i].label; 
                
                const x = (landmarks[8].x * vW * vScale) + vOffsetX;
                const y = (landmarks[8].y * vH * vScale) + vOffsetY;

                // スタート判定（鏡像反転を考慮したy座標チェック）
                if (!gameStarted && !isCoolingDown && landmarks[8].y < 0.25) {
                    startGame();
                }

                canvasCtx.beginPath();
                canvasCtx.arc(x, y, fingerRadius, 0, 2 * Math.PI);
                canvasCtx.fillStyle = (handLabel === 'Left') ? 'rgba(255, 0, 0, 0.6)' : 'rgba(0, 0, 255, 0.6)';
                canvasCtx.fill();
                canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                canvasCtx.lineWidth = 2;
                canvasCtx.stroke();

                if (gameStarted) checkHit(x, y, handLabel);
            }
        }

        if (gameStarted) {
            updateGame();
            drawCircles();
        }
        canvasCtx.restore();
    }

    function startGame() {
        if (gameStarted) return;
        gameStarted = true;
        score = 0;
        count = 1;
        remainingTime = 60;
        startTime = Date.now();
        msgElement.innerHTML = "";
        speak("スタート");
        initCircles();
    }

    function updateGame() {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        remainingTime = Math.max(0, 60 - elapsed);
        timerElement.innerText = `Time: ${remainingTime}`;
        scoreElement.innerText = `Score: ${score}`;
        if (remainingTime <= 0) endGame();
    }

    function endGame() {
        gameStarted = false;
        isCoolingDown = true;
        circles = []; 
        speak(`${score}点、終了`);
        let cooldownSec = 3;
        const updateCooldownMsg = () => {
            if (cooldownSec > 0) {
                msgElement.innerHTML = `終了！ Score: ${score}<br><span style="font-size:20px; color: #ff9;">Wait ${cooldownSec}...</span>`;
                cooldownSec--;
                setTimeout(updateCooldownMsg, 1000);
            } else {
                isCoolingDown = false;
                msgElement.innerHTML = `Score: ${score}<br><span style="font-size:20px; color: #0f0;">手を挙げて再開</span>`;
            }
        };
        updateCooldownMsg();
    }

    function checkHit(hx, hy, handLabel) {
        circles.forEach(c => {
            if (!c.cleared && c.num === count && c.handType === handLabel) {
                const dist = Math.sqrt((hx - c.x) ** 2 + (hy - c.y) ** 2);
                if (dist < (circleRadius + fingerRadius * 0.4)) {
                    c.cleared = true;
                    score++;
                    count++;
                    playBeep();
                    if (count > 10) { initCircles(); count = 1; }
                }
            }
        });
    }

    function drawCircles() {
        circles.forEach(c => {
            if (c.cleared) return;
            
            // ターゲットの円
            canvasCtx.beginPath();
            canvasCtx.arc(c.x, c.y, circleRadius, 0, 2 * Math.PI);
            canvasCtx.fillStyle = (c.handType === 'Left') ? '#ff0000' : '#0000ff';
            canvasCtx.fill();
            canvasCtx.strokeStyle = '#fff';
            canvasCtx.lineWidth = 2;
            canvasCtx.stroke();
            
            // 数字の描画（中心配置）
            canvasCtx.save();
            canvasCtx.translate(c.x, c.y);
            canvasCtx.scale(-1, 1); 
            canvasCtx.fillStyle = "#fff";
            canvasCtx.font = `bold ${fontSize}px sans-serif`;
            canvasCtx.textAlign = "center";
            canvasCtx.textBaseline = "middle";
            // 第3引数を 0 にすることで、中心点からの垂直オフセットをなくしました
            canvasCtx.fillText(c.num, 0, 0); 
            canvasCtx.restore();
        });
    }

    const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
        onFrame: async () => { await hands.send({image: videoElement}); },
        width: 1280, height: 720
    });
    camera.start();

    window.addEventListener('dblclick', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    });
</script>
</body>
</html>
